[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cst-research"
version = "0.1.0"
description = "Reproducible CST research protocols and experiment registry"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "takumiecd" }]
dependencies = []

[project.optional-dependencies]
torchcst = ["torchcst @ git+https://github.com/takumiecd/torchcst.git@97580582ed28c4e494bf5c2656bbe94a85c544c3"]
reporting = ["matplotlib"]

[project.scripts]
cst-research = "cst_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cst_research"]

[tool.ruff]
target-version = "py311"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint.per-file-ignores]
# Preserve the measured69 consumer bytes; its unused returned metadata is harmless.
"src/cst_research/experiments/higgs_depth_gain.py" = ["RUF059"]
